<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Name Greeting</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 1.125rem;
            line-height: 1.5;
            max-width: 28rem;
            margin: 3rem auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input,
        button {
            font: inherit;
            padding: 0.5rem;
        }

        #result.error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <!-- No "required" or "maxlength" here: validation happens only on the server (FR-007). -->
    <form id="greeting-form">
        <label for="name-input">Your name</label>
        <input id="name-input" type="text" autocomplete="off">
        <button id="submit-button" type="submit">Greet me</button>
    </form>

    <!-- aria-live lets screen readers announce the greeting or error when it appears. -->
    <p id="result" aria-live="polite"></p>

    <script src="app.js" defer></script>
</body>
</html>
